<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic HTML Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
    }

    header p {
      margin: 0;
      font-size: 0.95rem;
      color: #d0d7de;
    }

    main {
      flex: 1;
      padding: 2rem 1rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    footer {
      background-color: #1c2833;
      color: #d0d7de;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }

    footer a {
      color: #ffffff;
      margin: 0 0.5rem;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Website</h1>
    <p>A simple, basic HTML page</p>
  </header>

  <main>
    <p>This is a placeholder paragraph of body content. Replace this text with the actual content of your page.</p>
  </main>

  <footer>
    <p>&copy; 2024 Company Name. All rights reserved.</p>
    <p>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="#">Contact</a>
    </p>
  </footer>
</body>
</html>
